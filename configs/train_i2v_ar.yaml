# LongLive-2.0 causal I2V AR Stage-1 LoRA SFT.
# All heavyweight paths are explicit and may be overridden with the dedicated
# LONG_LIVE_STAGE1_* environment variables used by train_stage1_i2v.sh.
infra:
  expected_world_size: 6
  sequence_parallel_size: 3
  data_parallel_size: 2
  fsdp_backend: fsdp2
  sharding_strategy: hsdp
  device_mesh_shape: [2, 3]
  device_mesh_dim_names: [replicate, shard]
  mixed_precision: true
  gradient_checkpointing: true
  generator_fsdp_wrap_strategy: size
  cpu_offload: false
  model_quant: false

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  architecture_root: ${oc.env:LONG_LIVE_STAGE1_ARCHITECTURE_ROOT,/srv/workspace/Kirin_AI_Workspace/TMG_I/l00832862/shared_checkpoints/Wan2.2-TI2V-5B}
  init_weights: false

checkpoints:
  generator_ckpt: ${oc.env:LONG_LIVE_STAGE1_BASE_CHECKPOINT,/srv/workspace/Kirin_AI_Workspace/TMG_I/l00832862/LongLive-2.0/checkpoints/stage1/converted_causal_base.pt}
  base_manifest: ${oc.env:LONG_LIVE_STAGE1_BASE_MANIFEST,/srv/workspace/Kirin_AI_Workspace/TMG_I/l00832862/LongLive-2.0/checkpoints/stage1/converted_causal_base.manifest.json}

model_paths:
  # Cache extraction only reads these three auxiliary assets. The merged
  # bidirectional DiT checkpoint used by infer_batch.sh is intentionally not
  # loaded while precomputing VAE/T5 cache records.
  architecture_root: ${oc.env:LONG_LIVE_STAGE1_ARCHITECTURE_ROOT,/srv/workspace/Kirin_AI_Workspace/TMG_I/l00832862/shared_checkpoints/Wan2.2-TI2V-5B}
  t5_checkpoint: ${oc.env:LONG_LIVE_STAGE1_T5_CHECKPOINT,/srv/workspace/Kirin_AI_Workspace/TMG_I/l00832862/shared_checkpoints/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth}
  tokenizer_dir: ${oc.env:LONG_LIVE_STAGE1_TOKENIZER_DIR,/srv/workspace/Kirin_AI_Workspace/TMG_I/l00832862/shared_checkpoints/Wan2.2-TI2V-5B/google/umt5-xxl}
  vae_checkpoint: ${oc.env:LONG_LIVE_STAGE1_VAE_CHECKPOINT,/srv/workspace/Kirin_AI_Workspace/TMG_I/l00832862/shared_checkpoints/Wan2.2-TI2V-5B/Wan2.2_VAE.pth}

# Read only by scripts/precompute_stage1_i2v_cache.py. Formal Stage-1 training
# remains locked to infra.expected_world_size=6 and SP3 x DP2 above.
cache_precompute:
  expected_world_size: 4
  require_cuda: true
  minimum_cuda_capability: [9, 0]
  log_every_records: 10

algorithm:
  trainer: diffusion
  i2v: true
  causal: true
  teacher_forcing: true
  independent_first_frame: true
  num_train_timestep: 1000
  denoising_loss_type: flow
  noise_augmentation_max_timestep: 0
  prompt_dropout_prob: 0.0
  input_image_dropout_prob: 0.0

adapter:
  type: lora
  rank: 32
  alpha: 32
  dropout: 0.0
  bias: none
  modules_to_save: []
  target_patterns:
    - '^blocks\.[0-9]+\.self_attn\.(q|k|v|o)$'
    - '^blocks\.[0-9]+\.ffn\.(0|2)$'
  expected_target_modules: 180
  expected_trainable_parameters: 57016320
  expected_adapter_tensors: 360

preprocessing:
  min_source_frames: 97
  selected_frame_start: 0
  selected_frame_count: 93
  expected_fps: 24
  allow_resize: false
  allow_padding: false
  dtype: bfloat16
  prompt_mode: repeat_global

data:
  backend: stage1_i2v_cache
  metadata_path: training_sets/metadata_600clips_480x832_buckets.csv
  cache_dir: ${oc.env:LONG_LIVE_STAGE1_CACHE_DIR,/srv/workspace/Kirin_AI_Workspace/TMG_I/l00832862/LongLive-2.0/cache/stage1_i2v_600_bf16}
  expected_num_samples: 600
  image_or_video_shape: [1, 24, 48, 30, 52]
  allowed_latent_spatial_shapes: [[30, 52], [52, 30]]
  batch_size: 1
  num_workers: 2
  deterministic: true
  prompt_mode: repeat_global

training:
  seed: 1
  gradient_accumulation_steps: 2
  reset_optimizer_between_phases: false
  optimizer:
    type: adamw
    beta1: 0.0
    beta2: 0.999
    eps: 1.0e-8
    weight_decay: 0.0
    max_grad_norm: 10.0
  ema:
    enabled: true
    decay: 0.99
    start_step: 75
    dtype: float32
    device: cpu
    trainable_only: true
  phases:
    - name: phase_a_teacher_forcing
      epochs: 2
      lr: {schedule: constant, start: 1.0e-5, end: 1.0e-5}
      error_recycling: {mode: collect_only}
    - name: phase_b_error_recycling
      epochs: 3
      transition: {schedule: smoothstep, ramp_fraction: 0.4}
      lr: {start: 1.0e-5, end: 5.0e-6}
      error_recycling:
        mode: collect_and_inject
        max_active_prob: 0.5
        effective_context_prob: 0.30
        effective_latent_prob: 0.10
        effective_noise_prob: 0.0
  error_recycling:
    enabled: true
    enable_position_bucketing: true
    num_buckets: 24
    buffer_size_per_bucket: 32
    buffer_warmup_steps: 75
    replacement_strategy: random
    modulate_factor: 0.3
    clean_buffer_update_prob: 0.1
  nonfinite_max_attempts_per_update: 2

checkpointing:
  every_epochs: 0.5
  keep_last_resumable: 2
  keep_resumable_steps: [300]
  keep_all_adapters: true
  atomic_success_marker: true

evaluation:
  interval: 0

logging:
  backend: jsonl
  jsonl_path: metrics/train_metrics.jsonl
  console_every_steps: 10
  jsonl_every_steps: 1
  fsync_every_steps: 10
  disable_wandb: true
