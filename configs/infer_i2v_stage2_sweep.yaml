schema: longlive_stage2_inference_sweep/v1
base_config: infer_i2v_stage2_baseline.yaml
output_root: ${oc.env:LONG_LIVE_STAGE2_INFERENCE_OUTPUT,/path/to/stage2_sweep_inference}

# `named` keeps the frozen training/deployment baseline as the control group.
# Add exact C/W/K points under `cases`, or use `grids` for a Cartesian product.
# Dynamic sweep points are deployment-only, S=1, and can never enter training.
profile_set:
  named:
    - baseline_c8w16k4s1
    - c4w16k4s1
  grids: []
  cases:
    - {chunk_frames: 4, local_window_frames: 8, num_denoising_steps: 2}
    - {chunk_frames: 4, local_window_frames: 8, num_denoising_steps: 4}
    - {chunk_frames: 6, local_window_frames: 12, num_denoising_steps: 3}
    - {chunk_frames: 8, local_window_frames: 8, num_denoising_steps: 2}
    - {chunk_frames: 8, local_window_frames: 8, num_denoising_steps: 4}
    - {chunk_frames: 8, local_window_frames: 16, num_denoising_steps: 2}
    - {chunk_frames: 8, local_window_frames: 16, num_denoising_steps: 6}

# Default smoke matrix: 4 source cases x 1 seed x 9 profiles = 36 videos.
# CLI `--evaluation formal` promotes the same immutable profile set to
# 56 source/seed cases per profile without editing this file.
evaluation:
  mode: quick
  seeds: [1]
  single_row_ids: [0, 3]
  two_action_row_ids: [0, 4]
